document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\n  font-family: 'Sarabun';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"d570091b-50c4-4bf5-a1b9-bd46aa1bc664\") format('woff2');\n  unicode-range: U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Sarabun';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"bf4deab9-0dce-4e55-ae95-4d33f5264b52\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Sarabun';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"ed1b6e8f-7905-4a5a-bd62-249e4d529565\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Sarabun';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"dfee3dab-c1d6-470e-ad43-352adec79bc7\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   ACMS — Audit & Conduct Management System (hi-fi mockup)\n   State-enterprise enterprise UI · purple accent · Sarabun\n   ============================================================ */\n:root{\n  /* brand */\n  --brand:#5b3a8c; --brand-600:#4c2f78; --brand-700:#3c2461;\n  --brand-50:#f3eefa; --brand-100:#e6daf4; --brand-200:#d2bdeb;\n  /* neutrals (cool slate) */\n  --bg:#f3f4f8; --card:#ffffff; --canvas:#fafbfd;\n  --ink:#1b1e29; --text:#343846; --muted:#6b7180; --faint:#9aa0ad;\n  --line:#e7e8ef; --line-2:#eef0f5; --line-3:#f3f4f8;\n  /* sidebar */\n  --side:#241a35; --side-2:#2e2243; --side-line:#3a2d52;\n  --side-text:#c7c0d6; --side-muted:#8d83a3;\n  /* risk dims */\n  --r1:#bb4339; --r1-bg:#f8e9e7;   /* ไม่ปฏิบัติตามกฎ */\n  --r2:#2f6d99; --r2-bg:#e7f0f6;   /* กฎไม่ทันสมัย */\n  --r3:#bf872b; --r3-bg:#f8f0df;   /* ผิดพลาดซ้ำ */\n  /* status */\n  --ok:#2f8a5b; --ok-bg:#e6f3ec;\n  --warn:#bf872b; --warn-bg:#f8f0df;\n  --danger:#bb4339; --danger-bg:#f8e9e7;\n  --info:#2f6d99; --info-bg:#e7f0f6;\n  /* shape */\n  --r:11px; --r-sm:8px; --r-xs:6px;\n  --sh-sm:0 1px 2px rgba(22,22,44,.06), 0 1px 1px rgba(22,22,44,.04);\n  --sh:0 6px 20px rgba(28,28,55,.08);\n  --sh-lg:-12px 0 40px rgba(28,28,55,.16);\n  --fs:14px;\n}\n*{ box-sizing:border-box; }\nhtml,body{ margin:0; height:100%; }\nbody{\n  font-family:'Sarabun',sans-serif;\n  font-size:var(--fs); color:var(--text); background:var(--bg);\n  -webkit-font-smoothing:antialiased; line-height:1.5;\n}\n.mono{ font-family:'IBM Plex Mono',monospace; font-feature-settings:\"tnum\"; }\nbutton{ font-family:inherit; }\n::-webkit-scrollbar{ width:11px; height:11px; }\n::-webkit-scrollbar-thumb{ background:#d2d4de; border-radius:8px; border:3px solid transparent; background-clip:content-box; }\n::-webkit-scrollbar-thumb:hover{ background:#bcbfcc; background-clip:content-box; }\n\n/* ---------- app shell ---------- */\n.app{ display:flex; height:100vh; overflow:hidden; }\n\n/* sidebar */\n.sidebar{ width:248px; flex:none; background:var(--side); color:var(--side-text); display:flex; flex-direction:column; }\n.s-brand{ display:flex; align-items:center; gap:11px; padding:18px 18px 16px; border-bottom:1px solid var(--side-line); }\n.s-logo{ width:38px; height:38px; flex:none; border-radius:9px; background:linear-gradient(135deg,var(--brand) 0%,#7a52b3 100%); display:grid; place-items:center; color:#fff; font-weight:700; font-size:15px; box-shadow:0 3px 10px rgba(91,58,140,.5); }\n.s-brand .nm{ font-weight:700; color:#fff; font-size:15px; line-height:1.15; }\n.s-brand .sub{ font-size:11px; color:var(--side-muted); }\n.s-nav{ flex:1; overflow-y:auto; padding:12px 12px 20px; }\n.s-grp{ font-size:11px; letter-spacing:.06em; color:var(--side-muted); text-transform:uppercase; padding:14px 10px 6px; font-weight:600; }\n.s-item{ display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:9px; color:var(--side-text); cursor:pointer; font-size:14px; margin-bottom:2px; border:none; background:none; width:100%; text-align:left; transition:background .12s; }\n.s-item .ic{ width:18px; height:18px; flex:none; opacity:.85; }\n.s-item .cnt{ margin-left:auto; font-size:11px; background:var(--side-2); color:var(--side-text); border-radius:20px; padding:1px 8px; font-family:'IBM Plex Mono',monospace; }\n.s-item:hover{ background:var(--side-2); color:#fff; }\n.s-item.active{ background:linear-gradient(90deg,var(--brand) 0%,#6f49a6 100%); color:#fff; box-shadow:0 3px 12px rgba(91,58,140,.4); }\n.s-item.active .cnt{ background:rgba(255,255,255,.2); color:#fff; }\n.s-item.sub{ padding-left:40px; font-size:13px; color:var(--side-muted); }\n.s-item.sub.active{ background:var(--side-2); color:#fff; box-shadow:none; }\n.s-foot{ padding:12px 16px; border-top:1px solid var(--side-line); display:flex; align-items:center; gap:10px; font-size:12px; color:var(--side-muted); }\n.s-foot .av{ width:30px; height:30px; border-radius:50%; background:var(--side-2); display:grid; place-items:center; color:#fff; font-size:12px; font-weight:600; flex:none; }\n\n/* main */\n.main{ flex:1; display:flex; flex-direction:column; min-width:0; }\n.topbar{ height:60px; flex:none; background:var(--card); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; padding:0 26px; }\n.crumb{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }\n.crumb b{ color:var(--ink); font-size:18px; font-weight:600; }\n.crumb .sep{ color:var(--faint); }\n.tb-grow{ flex:1; }\n.search{ display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:7px 12px; width:300px; color:var(--faint); font-size:13px; }\n.search input{ border:none; background:none; outline:none; font-family:inherit; font-size:13px; color:var(--text); flex:1; }\n.tb-ic{ width:38px; height:38px; border-radius:9px; display:grid; place-items:center; color:var(--muted); cursor:pointer; border:1px solid var(--line); background:var(--card); position:relative; }\n.tb-ic:hover{ background:var(--bg); }\n.tb-ic .dot{ position:absolute; top:8px; right:9px; width:7px; height:7px; border-radius:50%; background:var(--danger); border:1.5px solid var(--card); }\n\n.content{ flex:1; overflow-y:auto; padding:24px 26px 60px; position:relative; }\n.page{ max-width:1240px; margin:0 auto; }\n.page-title{ display:flex; align-items:center; gap:12px; margin:0 0 4px; }\n.page-title h1{ font-size:22px; font-weight:700; color:var(--ink); margin:0; }\n.page-desc{ color:var(--muted); font-size:13.5px; margin:0 0 20px; }\n\n/* ---------- buttons ---------- */\n.btn{ display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:9px; padding:8px 14px; font-size:13.5px; font-weight:500; cursor:pointer; transition:all .12s; white-space:nowrap; }\n.btn:hover{ background:var(--bg); border-color:#d8dae3; }\n.btn .ic{ width:16px; height:16px; }\n.btn.pri{ background:var(--brand); border-color:var(--brand); color:#fff; box-shadow:0 2px 8px rgba(91,58,140,.28); }\n.btn.pri:hover{ background:var(--brand-600); border-color:var(--brand-600); }\n.btn.ghost{ border-color:transparent; background:transparent; }\n.btn.ghost:hover{ background:var(--bg); }\n.btn.sm{ padding:6px 11px; font-size:12.5px; border-radius:8px; }\n.btn.icon{ padding:8px; }\n.btn:disabled{ opacity:.5; cursor:not-allowed; }\n\n/* ---------- cards ---------- */\n.card{ background:var(--card); border:1px solid var(--lin
